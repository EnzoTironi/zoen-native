# zoen-staging-fdb: the Space logs, heads, membership and invites (ADR 0008).
# Private network only (zoen-staging-fdb.internal:4500); no public service, no http.
app = "zoen-staging-fdb"
primary_region = "gru"

[env]
  FDB_CLUSTER = "zoen:staging@zoen-staging-fdb.internal:4500"
  FDB_MEMORY = "1536MiB"
  FDB_CACHE = "256MiB"

[[mounts]]
  source = "fdbdata"
  destination = "/data"
  initial_size = "2gb"
  snapshot_retention = 5

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
