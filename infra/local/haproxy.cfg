global
    log stdout format raw local0
    maxconn 512
    nbthread 1
    stats socket /run/haproxy/stats.sock mode 600 level user

defaults
    mode http
    log global
    option logasap
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    timeout http-request 15s
    timeout http-keep-alive 5s
    timeout tunnel 1h
    retries 0
    log-format "kind=%[var(txn.kind)] upstream=%s status=%ST active_server=%sc"

resolvers docker
    nameserver embedded 127.0.0.11:53
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s

frontend local
    bind :8080
    http-request set-var(txn.kind) str(http)
    http-request set-var(txn.kind) str(sync) if { path -m str /v1/sync }
    default_backend native

backend native
    balance roundrobin
    option httpchk
    http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    http-check expect string ready
    default-server check inter 2s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr libc,none
    server relay_a relay:8080
    server relay_b relay2:8080
