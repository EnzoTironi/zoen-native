# Optional standard gateway; no native account, protocol or storage implementation.
services:
  frontdoor:
    pull_policy: never
    image: ${FRONTDOOR_IMAGE}
    ports: ['127.0.0.1:${FRONTDOOR_PORT}:8080']
    volumes: ['${STATE_DIR}/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro']
    tmpfs: ['/run/haproxy:uid=99,gid=99,mode=0700,size=1m']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 32
    networks: [private, edge]
    labels:
      app: zoen.local
      owner: '${OWNER_NONCE}'
      purpose: native-local-frontdoor
      config_sha256: '${FRONTDOOR_CONFIG_SHA256}'
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      relay: {condition: service_healthy}
      relay2: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:8080/readyz | grep -qx ready']
      interval: 3s
      timeout: 3s
      retries: 20
