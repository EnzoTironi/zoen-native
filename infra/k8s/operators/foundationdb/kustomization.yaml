# fdb-kubernetes-operator, pinned. Applied before the base (its CRDs must exist first);
# Argo CD syncs it in an earlier wave. It watches only the namespace it runs in.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zoen
resources:
  - https://raw.githubusercontent.com/FoundationDB/fdb-kubernetes-operator/v2.37.0/config/crd/bases/apps.foundationdb.org_foundationdbclusters.yaml
  - https://raw.githubusercontent.com/FoundationDB/fdb-kubernetes-operator/v2.37.0/config/crd/bases/apps.foundationdb.org_foundationdbbackups.yaml
  - https://raw.githubusercontent.com/FoundationDB/fdb-kubernetes-operator/v2.37.0/config/crd/bases/apps.foundationdb.org_foundationdbrestores.yaml
  - https://raw.githubusercontent.com/FoundationDB/fdb-kubernetes-operator/v2.37.0/config/samples/deployment.yaml
