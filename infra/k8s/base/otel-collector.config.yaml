# OpenTelemetry Collector for a relay cell (ADR 0021): the only way telemetry leaves the
# cluster. Relays push traces and logs over OTLP/HTTP; the collector scrapes their
# Prometheus /metrics. `attributes/scrub` is defense in depth: the relays never set these keys
# (journey_telemetry proves it), but no producer added later can send them past here either.
# Overlays replace the `debug` sink with the environment's backend.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: zoen-relay
          scrape_interval: 15s
          kubernetes_sd_configs:
            - role: pod
              namespaces: {own_namespace: true}
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
              regex: relay
              action: keep
            - source_labels: [__meta_kubernetes_pod_container_port_name]
              regex: metrics
              action: keep

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  attributes/scrub:
    actions:
      - {key: client.address, action: delete}
      - {key: client.port, action: delete}
      - {key: network.peer.address, action: delete}
      - {key: url.full, action: delete}
      - {key: url.path, action: delete}
      - {key: url.query, action: delete}
      - {key: http.url, action: delete}
      - {key: http.target, action: delete}
      - {key: user_agent.original, action: delete}
      - {key: enduser.id, action: delete}
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [debug]
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, batch]
      exporters: [debug]
