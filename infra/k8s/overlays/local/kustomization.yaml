# k3d on the box (scripts/local-cluster.sh). Secrets are generated by that script into the
# namespace; nothing secret is in git.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zoen
resources:
  - namespace.yaml
  - ../../base
images:
  - name: zoen-relay
    newName: zoen-relay
    newTag: dev
# One collector is enough on a laptop-sized node; base runs two for availability.
replicas:
  - name: otel-collector
    count: 1
