[package]
name = "zoen-agentd"
description = "Zoen agent runtime: tool manifests, tiers (WASM, microVM, browser), sandbox leases and budgets (ADR 0028)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
roda-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
zoen-egress.workspace = true
async-trait = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }

[dev-dependencies]
tempfile = "3"
