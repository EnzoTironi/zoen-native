[package]
name = "miniapps"
description = "Portable Zoen mini-app catalog, domain rules, resources, and privacy projections."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
types.workspace = true
localization.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
url = "2.5"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }

zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "=0.41.0"
# Structural PDF inspection only: upstream COS/filter/security layers, no UI,
# raster/image decoder, document JavaScript interpreter or separate PDF model.
pdfcraft-cos = { git = "https://github.com/storytold/pdfcraft", rev = "d445410807e7eefbe5b96f9662ab963ae8dd2a3a" }
