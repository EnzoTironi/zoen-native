[package]
name = "zoen-web-core"
description = "Browser adapter for Zoen's shared protocol and encrypted MLS client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
roda-types.workspace = true
roda-log.workspace = true
roda-proto.workspace = true
roda-docs.workspace = true
roda-grants.workspace = true
roda-apps.workspace = true
roda-i18n.workspace = true
roda-link.workspace = true
base64 = "0.22"
roda-mls = { workspace = true, features = ["portable"] }
openmls = { version = "0.9.1", features = ["js"] }
openmls_rust_crypto = "0.6"
openmls_traits = "0.6"
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
zeroize.workspace = true
getrandom = { workspace = true, features = ["js"] }
chacha20poly1305.workspace = true
hkdf.workspace = true
fastcdc = "5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
roda-mls = { workspace = true, features = ["device", "portable"] }
rusqlite.workspace = true
