[package]
name = "zoen-cli"
description = "`zoen`: the Zoen core at a terminal. Same engine, same sync and same keys flow as the app."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "zoen"
path = "src/main.rs"

[dependencies]
roda-ffi = { path = "../roda-ffi" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }

[dev-dependencies]
roda-proto = { path = "../roda-proto" }
roda-log = { path = "../roda-log" }
roda-types = { path = "../roda-types" }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.2"
hex = "0.4"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace", "logs"] }
prost = "0.14"
