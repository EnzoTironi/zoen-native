[package]
name = "zoen-cli"
description = "`zoen`: the Zoen core at a terminal. Same engine, same sync and same keys flow as the app."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "zoen"
path = "src/main.rs"

[dependencies]
client-core = { path = "../client-core" }
zoen-agentd = { path = "../zoen-agentd" }
gate.workspace = true
base64 = "0.22"
ed25519-dalek.workspace = true
hex.workspace = true
sha2.workspace = true
serde_json = "1"
zeroize.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }

[dev-dependencies]
serde.workspace = true
# Journeys run the scripted brain and fault points; production builds never have them.
zoen-agentd = { path = "../zoen-agentd", features = ["scripted"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
store.workspace = true
hkdf.workspace = true
async-nats = "0.50"
protocol = { path = "../protocol" }
event-log = { path = "../event-log" }
types = { path = "../types" }
serde_json = "1"
rusqlite.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.2"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace", "logs"] }
prost = "0.14"
