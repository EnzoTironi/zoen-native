<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Poll</title>
<style>
  :root { --color-background-secondary: #F1EFEA; --color-text-primary: #1C1C1E; --color-text-secondary: #6B6B70; --accent: #5B8DEF; --font-sans: -apple-system, system-ui, sans-serif; color-scheme: light dark; }
  [data-theme=dark] { --color-background-secondary: #2A2A2E; --color-text-primary: #F2F2F0; --color-text-secondary: #A1A1A6; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: transparent; font-family: var(--font-sans); color: var(--color-text-primary); -webkit-user-select: none; user-select: none; }
  .wrap { padding: 12px 14px 14px; }
  h1 { font-size: 17px; margin: 0 0 10px; font-weight: 700; letter-spacing: -0.2px; }
  .opt { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: inherit; font-size: 15px; font-weight: 600; color: var(--color-text-primary); border: 0; border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; background: var(--color-background-secondary); overflow: hidden; transition: transform .12s; }
  .opt:active { transform: scale(.97); }
  .opt .bg { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--accent) 22%, transparent); transition: width .5s cubic-bezier(.2,.9,.3,1.2); }
  .opt span { position: relative; }
  .opt .n { margin-left: auto; color: var(--color-text-secondary); font-variant-numeric: tabular-nums; }
  .opt.mine { box-shadow: inset 0 0 0 2px var(--accent); }
  .opt.win { box-shadow: inset 0 0 0 2px #3FB27F; }
  .voters { font-size: 11px; color: var(--color-text-secondary); font-weight: 500; }
  .row { display: flex; gap: 8px; margin-top: 4px; }
  input { flex: 1; font: inherit; font-size: 14px; border: 0; border-radius: 12px; padding: 10px 12px; background: var(--color-background-secondary); color: var(--color-text-primary); outline: none; }
  button.small { font: inherit; font-size: 14px; font-weight: 650; border: 0; border-radius: 12px; padding: 10px 14px; background: var(--color-background-secondary); color: var(--color-text-primary); }
  button.primary { width: 100%; margin-top: 10px; background: var(--color-text-primary); color: var(--color-background-secondary); }
  .meta { font-size: 12px; color: var(--color-text-secondary); margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="q">…</h1>
  <div id="opts"></div>
  <div class="row" id="addrow"><input id="txt" placeholder="Suggest another option" data-i18n-ph="suggest" maxlength="60"><button class="small" id="add">＋</button></div>
  <button class="small primary" id="close" data-i18n="close">Close and add to plan</button>
  <div class="meta" id="meta"></div>
</div>
<script>
const I18N = {
  en: { title: 'Poll', suggest: 'Suggest another option', close: 'Close and add to plan', closed: 'Closed · %@ is in the plan', failed: 'Couldn’t do that right now' },
  pt: { title: 'Enquete', suggest: 'Sugerir outra opção', close: 'Fechar e levar ao plano', closed: 'Fechada · %@ entrou no plano', failed: 'Não deu agora' },
};
// i18n: English by default; follows hostContext.locale (pt-BR is the second language).
let LANG = 'en';
function T(k) { return (LANG === 'pt' && I18N.pt[k]) || I18N.en[k] || k; }
function applyLocale(locale) {
  LANG = String(locale || '').toLowerCase().startsWith('pt') ? 'pt' : 'en';
  document.documentElement.lang = LANG === 'pt' ? 'pt-BR' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = T(el.dataset.i18nPh); });
  if (I18N.en.title) document.title = T('title');
}

// ── Cliente MCP mínimo (JSON-RPC 2.0 via postMessage), como no SEP-1865 ──
const rpc = (() => {
  let next = 0; const pending = new Map(); const handlers = {};
  window.addEventListener('message', (e) => {
    const m = e.data; if (!m || m.jsonrpc !== '2.0') return;
    if (m.id != null && !m.method && pending.has(m.id)) { const p = pending.get(m.id); pending.delete(m.id); m.error ? p.reject(m.error) : p.resolve(m.result); return; }
    if (m.method && m.id != null) { const r = handlers[m.method] ? handlers[m.method](m.params) : {}; window.parent.postMessage({ jsonrpc: '2.0', id: m.id, result: r || {} }, '*'); return; }
    if (m.method && handlers[m.method]) handlers[m.method](m.params);
  });
  return {
    request(method, params) { const id = ++next; window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*'); return new Promise((resolve, reject) => pending.set(id, { resolve, reject })); },
    notify(method, params) { window.parent.postMessage({ jsonrpc: '2.0', method, params }, '*'); },
    on(method, fn) { handlers[method] = fn; },
  };
})();
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let me = null;
function render(st) {
  if (!st) return;
  requestAnimationFrame(() => reportSize()); setTimeout(reportSize, 60);
  document.getElementById('q').textContent = st.question;
  const total = st.options.reduce((n, o) => n + o.votes.length, 0);
  const box = document.getElementById('opts'); box.innerHTML = '';
  for (const o of st.options) {
    const b = document.createElement('button'); b.className = 'opt';
    const pct = total ? Math.round(o.votes.length * 100 / total) : 0;
    if (me && o.votes.includes(me)) b.classList.add('mine');
    if (st.closed && st.winner === o.text) b.classList.add('win');
    b.innerHTML = '<div class="bg" style="width:' + pct + '%"></div><span>' + esc(o.text) + (o.votes.length ? '<br><span class="voters">' + o.votes.map(esc).join(', ') + '</span>' : '') + '</span><span class="n">' + (st.closed && st.winner === o.text ? '✓ ' : '') + o.votes.length + '</span>';
    b.disabled = st.closed;
    b.onclick = () => call('poll_vote', { option: o.id });
    box.appendChild(b);
  }
  document.getElementById('addrow').style.display = st.closed ? 'none' : 'flex';
  document.getElementById('close').style.display = st.closed ? 'none' : 'block';
  const last = (st.log || [])[0];
  document.getElementById('meta').textContent = st.closed ? T('closed').replace('%@', st.winner) : (last ? last.who + ' ' + last.what : '');
}
async function call(name, args) {
  try { const r = await rpc.request('tools/call', { name, arguments: args || {} }); if (r.structuredContent) { const l = (r.structuredContent.log || [])[0]; if (l && name === 'poll_vote') me = l.who; render(r.structuredContent); } if (r.isError && r.content) alertish(r.content[0].text); }
  catch (e) { alertish((e && e.message) || T('failed')); }
}
function alertish(t) { document.getElementById('meta').textContent = t; }
document.getElementById('add').onclick = () => { const t = document.getElementById('txt'); if (t.value.trim()) { call('poll_add_option', { text: t.value.trim() }); t.value = ''; } };
document.getElementById('close').onclick = () => call('poll_close', {});
function applyContext(c) {
  if (!c) return;
  if (c.locale) applyLocale(c.locale);
  if (c.theme) document.documentElement.dataset.theme = c.theme;
  const vars = c.styles && c.styles.variables; if (vars) for (const k in vars) if (vars[k]) document.documentElement.style.setProperty(k, vars[k]);
}
rpc.on('ui/notifications/tool-input', () => {});
rpc.on('ui/notifications/tool-result', (r) => render(r && r.structuredContent));
rpc.on('ui/notifications/host-context-changed', applyContext);
rpc.on('ui/resource-teardown', () => ({}));
// Altura real do conteúdo (não da janela), para o host dimensionar o cartão.
let lastH = 0;
function reportSize() {
  const r = document.body.getBoundingClientRect(); const h = Math.ceil(r.height);
  if (Math.abs(h - lastH) < 1) return; lastH = h;
  rpc.notify('ui/notifications/size-changed', { width: Math.ceil(r.width), height: h });
}
new ResizeObserver(reportSize).observe(document.body);
window.addEventListener('load', () => requestAnimationFrame(reportSize));
(async () => {
  try { const init = await rpc.request('ui/initialize', { protocolVersion: '2026-01-26', appInfo: { name: 'roda-poll', version: '1.0.0' }, appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] } }); applyContext(init && init.hostContext); } catch (e) {}
  rpc.notify('ui/notifications/initialized', {});
})();
</script>
</body>
</html>
