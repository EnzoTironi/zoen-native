[package]
name = "roda-ffi"
description = "Motor do Zoen exposto para Swift e Kotlin via UniFFI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "roda_ffi"

[dependencies]
roda-types.workspace = true
roda-log.workspace = true
roda-grants.workspace = true
roda-store.workspace = true
roda-mls = { workspace = true, features = ["device"] }
rusqlite.workspace = true
serde_json.workspace = true
thiserror.workspace = true

sha2.workspace = true
hex.workspace = true
uniffi = { workspace = true, features = ["tokio"] }
roda-proto.workspace = true
serde.workspace = true
getrandom.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
chacha20poly1305.workspace = true
roda-docs.workspace = true
zoen-liveview.workspace = true
hkdf.workspace = true
base64 = "0.22"
fastcdc = "5"

[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = "1"

[dev-dependencies]
sha2.workspace = true
