[package]
name = "zoen-runtime"
description = "Zoen-owned Postgres financial authority and fenced FDB execution admission."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
zoen-models = { path = "../zoen-models" }
zoen-relay = { path = "../zoen-relay" }
types.workspace = true
event-log.workspace = true
protocol.workspace = true
client-core = { path = "../client-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
url = "2"
getrandom.workspace = true
zeroize.workspace = true
chacha20poly1305.workspace = true
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json", "migrate", "macros"] }
foundationdb = { version = "0.11", default-features = false, features = ["fdb-7_3", "embedded-fdb-include"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
png = "0.18.1"
base64 = "0.22.1"
mls.workspace = true
store.workspace = true
tokio = { version = "1", features = ["net", "io-util"] }
