[package]
name = "zoen-sandboxd"
description = "Zoen sandbox node agent: Firecracker microVMs under the jailer, template snapshots, a warm pool, cgroup limits, egress over vsock (ADR 0028)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
zoen-agentd = { path = "../zoen-agentd" }
zoen-egress.workspace = true
zoen-guestd = { path = "../zoen-guestd" }
roda-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true
getrandom.workspace = true
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "net"] }

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
