[package]
name = "zoen-word-profile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "d1b0bfc3f9dd83126b162a42b667facecb003b7f" }
wordcraft-docx = { git = "https://github.com/storytold/wordcraft", rev = "d1b0bfc3f9dd83126b162a42b667facecb003b7f" }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "=0.41.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
