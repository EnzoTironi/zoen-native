[workspace]
resolver = "2"
members = [
  "crates/types",
  "crates/localization",
  "crates/miniapps",
  "crates/wordcraft-profile",
  "crates/device-link",
  "crates/event-log",
  "crates/grants",
  "crates/store",
  "crates/client-core",
  "crates/documents",
  "crates/gate",
  "crates/protocol",
  "crates/relay-admission",
  "crates/mls",
  "crates/zoen-web-core",
  "crates/zoen-relay",
  "crates/zoen-cli",
  "crates/zoen-load",
  "crates/zoen-agentd",
  "crates/zoen-models",
  "crates/zoen-runtime",
  "crates/zoen-egress",
  "crates/zoen-guestd",
  "crates/zoen-sandboxd",
  "crates/zoen-liveview",
  "tools/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# Shared JSON wire parser: native and host must round-trip the same f64 values.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = "2"
getrandom = "0.2"
zeroize = "1.9.1"
chacha20poly1305 = "0.11.0"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
curve25519-dalek = { version = "4", features = ["digest"] }
argon2 = "0.5"
rusqlite = { version = "0.37", features = ["bundled", "serialize"] }
uniffi = "0.32"
prost = "0.14"
num-traits = "0.2.19"
types = { path = "crates/types" }
localization = { path = "crates/localization" }
miniapps = { path = "crates/miniapps" }
device-link = { path = "crates/device-link" }
event-log = { path = "crates/event-log" }
grants = { path = "crates/grants" }
gate = { path = "crates/gate" }
store = { path = "crates/store" }
protocol = { path = "crates/protocol" }
relay-admission = { path = "crates/relay-admission" }
documents = { path = "crates/documents" }
mls = { path = "crates/mls", default-features = false }
zoen-egress = { path = "crates/zoen-egress" }
zoen-liveview = { path = "crates/zoen-liveview" }

# Backup passwords stretch with Argon2id (64 MiB, ADR 0046): unoptimized it takes seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Debug imports build Loro pages, decode the durable queue, and seal MLS messages.
# Generic serializers and crypto use the profile of their core-library callers.
[profile.dev.package.event-log]
opt-level = 3
[profile.dev.package.mls]
opt-level = 3
[profile.dev.package.documents]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.loro-internal]
opt-level = 3
[profile.dev.package.loro-kv-store]
opt-level = 3
[profile.dev.package.store]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
[profile.dev.package.foldhash]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"

# Member manifests must opt in; scripts/check-rust-lint-policy.py enforces coverage.
[workspace.lints.rust]
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_lock = "deny"
undocumented_unsafe_blocks = "deny"
# Selected nursery rules; the entire experimental/restriction groups are not enabled.
redundant_clone = "warn"
significant_drop_in_scrutinee = "warn"
