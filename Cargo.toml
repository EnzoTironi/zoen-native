[workspace]
resolver = "2"
members = [
  "crates/roda-types",
  "crates/roda-log",
  "crates/roda-grants",
  "crates/roda-store",
  "crates/roda-ffi",
  "crates/roda-docs",
  "crates/roda-gate",
  "crates/roda-proto",
  "crates/roda-mls",
  "crates/zoen-relay",
  "crates/zoen-cli",
  "crates/zoen-load",
  "crates/zoen-agentd",
  "crates/zoen-egress",
  "crates/zoen-guestd",
  "crates/zoen-sandboxd",
  "crates/zoen-liveview",
  "tools/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = "2"
getrandom = "0.2"
chacha20poly1305 = "0.11.0"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
curve25519-dalek = { version = "4", features = ["digest"] }
argon2 = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }
uniffi = "0.32"
prost = "0.14"
roda-types = { path = "crates/roda-types" }
roda-log = { path = "crates/roda-log" }
roda-grants = { path = "crates/roda-grants" }
roda-gate = { path = "crates/roda-gate" }
roda-store = { path = "crates/roda-store" }
roda-proto = { path = "crates/roda-proto" }
roda-docs = { path = "crates/roda-docs" }
roda-mls = { path = "crates/roda-mls", default-features = false }
zoen-egress = { path = "crates/zoen-egress" }
zoen-liveview = { path = "crates/zoen-liveview" }

# Backup passwords stretch with Argon2id (64 MiB, ADR 0046): unoptimized it takes seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
