[package]
name = "pdfcraft-zoen-host"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[features]
browser = ["dep:pdfcraft-ui-egui"]

[dependencies]
pdfcraft-ui-egui = { workspace = true, optional = true }
pdfcraft-engine = { workspace = true }
pdfcraft-cos = { workspace = true }
pdfcraft-create = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { version = "0.10", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
