[package]
name = "wordcraft-zoen-host"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[features]
qualification = ["dep:wordcraft-formats", "dep:wordcraft-layout"]

[[bin]]
name = "wordcraft-clock-probe"
path = "src/clock_probe.rs"
required-features = ["qualification"]

[dependencies]
wordcraft-doc = { path = "../doc" }
wordcraft-docx = { path = "../docx" }
wordcraft-engine = { path = "../engine" }
wordcraft-formats = { path = "../formats", optional = true }
wordcraft-layout = { path = "../layout", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
