[package]
name = "wordcraft-zoen-host"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
wordcraft-doc = { path = "../doc" }
wordcraft-docx = { path = "../docx" }
wordcraft-engine = { path = "../engine" }
serde = { workspace = true }
serde_json = { workspace = true }
