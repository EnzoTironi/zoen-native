[package]
name = "gridcraft-zoen-host"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# Materialized as crates/zoen-host inside the exact pinned upstream source.
[features]
ui-tests = ["dep:gridcraft-ui-egui", "dep:egui", "dep:egui_kittest"]

[dependencies]
gridcraft-engine = { path = "../engine" }
gridcraft-model = { path = "../model" }
gridcraft-ui-egui = { path = "../ui-egui", optional = true }
egui = { version = "0.36", optional = true }
egui_kittest = { version = "0.36", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "=0.41.0"

[lints.rust]
unsafe_code = "forbid"
