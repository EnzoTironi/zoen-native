# Rust checks and every box journey on Linux: fmt, clippy (-D warnings), unit tests, and the
# journeys against a real relay, Postgres, FoundationDB and NATS. No macOS runners: the
# current Expo simulator acceptance is qualified separately on the Mac.
name: ci

on:
  push:
    branches: [main, 'real/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  RUST_TOOLCHAIN: '1.99.0'
  ZOEN_TEST_PG: postgres://zoen@127.0.0.1:5432/postgres

jobs:
  change-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      documentation_only: ${{ steps.scope.outputs.documentation_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        name: Select conservative CI scope
        env:
          ZOEN_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ZOEN_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ZOEN_CI_EVENT: ${{ github.event_name }}
        run: python3 scripts/ci-documentation-scope.py --base "$ZOEN_CI_BASE" --head "$ZOEN_CI_HEAD" --event "$ZOEN_CI_EVENT"

      - name: Changed authored file size limit
        env:
          ZOEN_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ZOEN_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check-changed-file-sizes.py --base "$ZOEN_CI_BASE" --head "$ZOEN_CI_HEAD"

  documentation-integrity:
    needs: change-scope
    if: needs.change-scope.outputs.documentation_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Changed prose encoding, size and local link targets
        env:
          ZOEN_CI_BASE: ${{ github.event.pull_request.base.sha }}
          ZOEN_CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-documentation-scope.py --base "$ZOEN_CI_BASE" --head "$ZOEN_CI_HEAD" --event pull_request --check-documents

  local-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Native local tooling syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for source in sorted(Path("infra/local").glob("*.py")):
              compile(source.read_bytes(), str(source), "exec")
          PY
          sh -n infra/fdb/server-entrypoint.sh

      - name: Resource ownership and backup integrity
        run: python3 -m unittest discover -s infra/local -p 'test_*.py' -v

      - name: Staged file size hook contracts
        run: python3 -m unittest discover -s scripts/git-hooks -p 'test_*.py' -v

      - name: Documentation CI scope regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_ci_documentation_scope.py' -v

      - name: Canonical acceptance composition and source writes
        run: python3 scripts/test-acceptance.py

  rust:
    needs: change-scope
    # A skipped job means no compiler/integration test execution; prose has its own check.
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.documentation_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
          # The WASM tier's journey builds its tools as WASI p2 components (ADR 0028 T0).
          rustup target add wasm32-wasip2

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Shared Cargo source qualification guard
        run: python3 -m unittest discover -s scripts/tests -p 'test_cargo*.py' -v

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Expo Core shared-target entrypoint contracts
        run: |
          # Prepare locked registry metadata on cold runners; the tests use offline
          # metadata and compile only their own tiny, dependency-free workspaces.
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/expo-core-metadata.json"
          node --test --test-concurrency=1 scripts/tests/build-expo-core.test.mjs scripts/tests/expo-ios-orchestration.test.mjs scripts/tests/expo-android-proxy.test.mjs scripts/tests/expo-android-orchestration.test.mjs

      - name: Format
        run: cargo fmt --all --check

      - name: Postgres, FoundationDB and NATS
        run: |
          # Registries rate-limit shared runners: try two mirrors of the same image, with backoff.
          pg=""
          for attempt in 1 2 3; do
            for img in public.ecr.aws/docker/library/postgres:17-alpine mirror.gcr.io/library/postgres:17-alpine; do
              docker pull -q "$img" && { pg="$img"; break 2; }
            done
            sleep $((attempt * 15))
          done
          test -n "$pg"
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_USER=zoen -e POSTGRES_HOST_AUTH_METHOD=trust \
            "$pg" -c max_connections=300
          scripts/fdb.sh up
          scripts/nats.sh up
          eval "$(scripts/fdb.sh env)"
          eval "$(scripts/nats.sh env)"
          for v in FDB_CLUSTER_FILE LIBRARY_PATH LD_LIBRARY_PATH ZOEN_NATS_URL; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done
          for _ in $(seq 1 30); do docker exec pg pg_isready -U zoen >/dev/null 2>&1 && break; sleep 1; done

      - name: gVisor for the sandbox journeys (ADR 0028 P0)
        run: |
          # rootless runsc needs unprivileged user namespaces, which Ubuntu 24.04's AppArmor
          # restricts by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          scripts/gvisor.sh up
          eval "$(scripts/gvisor.sh env)"
          echo "ZOEN_RUNSC=$ZOEN_RUNSC" >> "$GITHUB_ENV"
          echo "ZOEN_SANDBOX_ROOTFS=$ZOEN_SANDBOX_ROOTFS" >> "$GITHUB_ENV"

      - name: Firecracker for the microVM and browser journeys (ADR 0028 P1, P2)
        run: |
          # GitHub's Linux runners have /dev/kvm; the jailer (through sudo) gives each VMM its
          # own device node, so the runner user doesn't need the kvm group.
          test -e /dev/kvm
          rustup target add x86_64-unknown-linux-musl
          scripts/firecracker.sh up
          scripts/firecracker.sh image
          # The browser microVM's image: Alpine's Chromium on top of the base (sudo for apk).
          scripts/firecracker.sh browser-image
          scripts/firecracker.sh cgroup
          eval "$(scripts/firecracker.sh env)"
          for v in ZOEN_FIRECRACKER ZOEN_JAILER ZOEN_VMLINUX ZOEN_GUEST_ROOTFS ZOEN_BROWSER_ROOTFS ZOEN_SANDBOX_CGROUP; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done
          echo "ZOEN_REQUIRE_FIRECRACKER=1" >> "$GITHUB_ENV"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Workspace feature unification includes the CLI's insertion-ordered JSON.
      # Qualify the native core separately so it cannot hide a cross-client drift.
      - name: Native and CLI tool JSON contracts
        run: |
          cargo test --locked -p client-core --lib agent_binary_documents::tool_approvals::tests::json_order
          cargo test --locked -p client-core --lib --features serde_json/preserve_order,serde_json/float_roundtrip,serde_json/raw_value agent_binary_documents::tool_approvals::tests::json_order

      - name: Prepare safe synthetic Sync diagnostics
        env:
          ZOEN_SYNC_DIAGNOSTIC_DIR: ${{ runner.temp }}/zoen-sync-diagnostics
        run: |
          mkdir -p "$ZOEN_SYNC_DIAGNOSTIC_DIR"
          chmod 700 "$ZOEN_SYNC_DIAGNOSTIC_DIR"

      - name: Tests and journeys
        env:
          ZOEN_SYNC_DIAGNOSTIC_DIR: ${{ runner.temp }}/zoen-sync-diagnostics
        run: cargo test --workspace --no-fail-fast

      # Only typed, bounded observations written by a failed synthetic World.
      # Never upload its home, vault, SQLite, raw stderr/stdout or relay log.
      - name: Safe synthetic Sync failure observations
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-sync-readiness
          path: ${{ runner.temp }}/zoen-sync-diagnostics/*.json
          if-no-files-found: ignore
          retention-days: 3

  # The web client end to end: two CLI "phones" link two headless Chromes through a real relay
  # (Postgres + FoundationDB) and chat, react, thread, and send photos, video, files and voice.
  web-e2e:
    needs: change-scope
    # A skipped job means no compiler/integration test execution; prose has its own check.
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.documentation_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: web-e2e

      - name: Postgres and FoundationDB
        run: |
          pg=""
          for attempt in 1 2 3; do
            for img in public.ecr.aws/docker/library/postgres:17-alpine mirror.gcr.io/library/postgres:17-alpine; do
              docker pull -q "$img" && { pg="$img"; break 2; }
            done
            sleep $((attempt * 15))
          done
          test -n "$pg"
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=zoen -e POSTGRES_HOST_AUTH_METHOD=trust "$pg"
          scripts/fdb.sh up
          eval "$(scripts/fdb.sh env)"
          for v in FDB_CLUSTER_FILE LIBRARY_PATH LD_LIBRARY_PATH; do echo "$v=${!v}" >> "$GITHUB_ENV"; done
          for _ in $(seq 1 30); do docker exec pg pg_isready -U zoen >/dev/null 2>&1 && break; sleep 1; done

      - name: Build relay, CLI and web
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          cargo build -p zoen-relay -p zoen-cli
          cd packages/zoen-ui && npm ci && node web/build.mjs

      - name: Two people on the web
        env:
          ZOEN_LIMITS: connect_ip=100000/s:100000,register_ip=100000/s:100000
          ZOEN_SHOTS: ${{ runner.temp }}/web-shots
        run: |
          mkdir -p .dev/blobs
          DATABASE_URL="$ZOEN_TEST_PG" ZOEN_RELAY_NAME=zoen-ci ZOEN_BLOB_DIR=.dev/blobs \
            target/debug/zoen-relay --bind 127.0.0.1:8790 > relay.log 2>&1 &
          (cd packages/zoen-ui && node web/server.mjs > ../../web.log 2>&1 &)
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:4174/ >/dev/null && curl -s http://127.0.0.1:8790/ >/dev/null && break; sleep 1; done
          cd packages/zoen-ui/web/e2e && npm i --no-save playwright-core@1.64.1
          RELAY=http://127.0.0.1:8790 ZOEN_CLI="$GITHUB_WORKSPACE/target/debug/zoen" CHROME="$(command -v google-chrome)" node two-people.mjs

      - name: Logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e
          path: |
            relay.log
            web.log
            ${{ runner.temp }}/web-shots
