# Rust checks and every box journey on Linux: fmt, clippy (-D warnings), unit tests, and the
# journeys against a real relay, Postgres, FoundationDB and NATS. No macOS runners: the
# simulator journey runs on the Mac (scripts/journey-sim.sh).
name: ci

on:
  push:
    branches: [main, "real/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_TOOLCHAIN: "1.99.0"
  ZOEN_TEST_PG: postgres://zoen@127.0.0.1:5432/postgres

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
          # The WASM tier's journey builds its tools as WASI p2 components (ADR 0028 T0).
          rustup target add wasm32-wasip2

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Postgres, FoundationDB and NATS
        run: |
          # Registries rate-limit shared runners: try two mirrors of the same image, with backoff.
          pg=""
          for attempt in 1 2 3; do
            for img in public.ecr.aws/docker/library/postgres:17-alpine mirror.gcr.io/library/postgres:17-alpine; do
              docker pull -q "$img" && { pg="$img"; break 2; }
            done
            sleep $((attempt * 15))
          done
          test -n "$pg"
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_USER=zoen -e POSTGRES_HOST_AUTH_METHOD=trust \
            "$pg" -c max_connections=300
          scripts/fdb.sh up
          scripts/nats.sh up
          eval "$(scripts/fdb.sh env)"
          eval "$(scripts/nats.sh env)"
          for v in FDB_CLUSTER_FILE LIBRARY_PATH LD_LIBRARY_PATH ZOEN_NATS_URL; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done
          for _ in $(seq 1 30); do docker exec pg pg_isready -U zoen >/dev/null 2>&1 && break; sleep 1; done

      - name: gVisor for the sandbox journeys (ADR 0028 P0)
        run: |
          # rootless runsc needs unprivileged user namespaces, which Ubuntu 24.04's AppArmor
          # restricts by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          scripts/gvisor.sh up
          eval "$(scripts/gvisor.sh env)"
          echo "ZOEN_RUNSC=$ZOEN_RUNSC" >> "$GITHUB_ENV"
          echo "ZOEN_SANDBOX_ROOTFS=$ZOEN_SANDBOX_ROOTFS" >> "$GITHUB_ENV"

      - name: Firecracker for the microVM and browser journeys (ADR 0028 P1, P2)
        run: |
          # GitHub's Linux runners have /dev/kvm; the jailer (through sudo) gives each VMM its
          # own device node, so the runner user doesn't need the kvm group.
          test -e /dev/kvm
          rustup target add x86_64-unknown-linux-musl
          scripts/firecracker.sh up
          scripts/firecracker.sh image
          # The browser microVM's image: Alpine's Chromium on top of the base (sudo for apk).
          scripts/firecracker.sh browser-image
          scripts/firecracker.sh cgroup
          eval "$(scripts/firecracker.sh env)"
          for v in ZOEN_FIRECRACKER ZOEN_JAILER ZOEN_VMLINUX ZOEN_GUEST_ROOTFS ZOEN_BROWSER_ROOTFS ZOEN_SANDBOX_CGROUP; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done
          echo "ZOEN_REQUIRE_FIRECRACKER=1" >> "$GITHUB_ENV"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests and journeys
        run: |
          # Cargo summarizes only failed targets at the very end. Preserve the
          # actual panic contexts there too, so bounded check-log readers can
          # diagnose a failure without weakening or rerunning the suite.
          set +e
          cargo test --workspace --no-fail-fast 2>&1 | tee /tmp/cargo-test.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            echo "Failure contexts (repeated at end of job):"
            grep -n -B 4 -A 12 -E 'panicked at|test result: FAILED|error: [0-9]+ targets failed' /tmp/cargo-test.log \
              | tail -n 1200 || true
          fi
          exit "$status"

  # The web client end to end: two CLI "phones" link two headless Chromes through a real relay
  # (Postgres + FoundationDB) and chat, react, thread, and send photos, video, files and voice.
  web-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: web-e2e

      - name: Postgres and FoundationDB
        run: |
          pg=""
          for attempt in 1 2 3; do
            for img in public.ecr.aws/docker/library/postgres:17-alpine mirror.gcr.io/library/postgres:17-alpine; do
              docker pull -q "$img" && { pg="$img"; break 2; }
            done
            sleep $((attempt * 15))
          done
          test -n "$pg"
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=zoen -e POSTGRES_HOST_AUTH_METHOD=trust "$pg"
          scripts/fdb.sh up
          eval "$(scripts/fdb.sh env)"
          for v in FDB_CLUSTER_FILE LIBRARY_PATH LD_LIBRARY_PATH; do echo "$v=${!v}" >> "$GITHUB_ENV"; done
          for _ in $(seq 1 30); do docker exec pg pg_isready -U zoen >/dev/null 2>&1 && break; sleep 1; done

      - name: Build relay, CLI and web
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          cargo build -p zoen-relay -p zoen-cli
          cd packages/zoen-ui && npm ci && node web/build.mjs

      - name: Two people on the web
        env:
          ZOEN_LIMITS: connect_ip=100000/s:100000,register_ip=100000/s:100000
          ZOEN_SHOTS: ${{ runner.temp }}/web-shots
        run: |
          mkdir -p .dev/blobs
          DATABASE_URL="$ZOEN_TEST_PG" ZOEN_RELAY_NAME=zoen-ci ZOEN_BLOB_DIR=.dev/blobs \
            target/debug/zoen-relay --bind 127.0.0.1:8790 > relay.log 2>&1 &
          (cd packages/zoen-ui && node web/server.mjs > ../../web.log 2>&1 &)
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:4174/ >/dev/null && curl -s http://127.0.0.1:8790/ >/dev/null && break; sleep 1; done
          cd packages/zoen-ui/web/e2e && npm i --no-save playwright-core@1.64.1
          RELAY=http://127.0.0.1:8790 ZOEN_CLI="$GITHUB_WORKSPACE/target/debug/zoen" CHROME="$(command -v google-chrome)" node two-people.mjs

      - name: Logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e
          path: |
            relay.log
            web.log
            ${{ runner.temp }}/web-shots
