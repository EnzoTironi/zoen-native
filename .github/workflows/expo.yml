name: expo

on:
  pull_request:
    paths:
      [
        'apps/zoen/**',
        'packages/zoen-ui/**',
        'packages/zoen-miniapp-sdk/**',
        'miniapps/**',
        'tools/miniapp-build/**',
        'tools/uniffi-bindgen/**',
        'crates/**',
        'Cargo.toml',
        'Cargo.lock',
        'scripts/build-expo-*.mjs',
        'scripts/build-android-core.sh',
        'scripts/android-core-contract.py',
        'scripts/fix-android-uniffi-callbacks.py',
        'android/uniffi.toml',
        'scripts/deploy-expo-web.mjs',
        'scripts/expo-web-*.mjs',
        'scripts/expo-web-tests/**',
        'scripts/verify-cloudflare-admission.mjs',
        'scripts/verify-cloudflare-provider.mjs',
        'scripts/verify-cloudflare-closed.mjs',
        'scripts/verify-cloudflare-directory.mjs',
        'scripts/build-cloudflare-closed.mjs',
        'infra/cloudflare/**',
        '.github/workflows/expo.yml',
      ]
  push:
    branches: [main]
    paths:
      [
        'apps/zoen/**',
        'packages/zoen-ui/**',
        'packages/zoen-miniapp-sdk/**',
        'miniapps/**',
        'tools/miniapp-build/**',
        'tools/uniffi-bindgen/**',
        'crates/**',
        'Cargo.toml',
        'Cargo.lock',
        'scripts/build-expo-*.mjs',
        'scripts/build-android-core.sh',
        'scripts/android-core-contract.py',
        'scripts/fix-android-uniffi-callbacks.py',
        'android/uniffi.toml',
        'scripts/deploy-expo-web.mjs',
        'scripts/expo-web-*.mjs',
        'scripts/expo-web-tests/**',
        'scripts/verify-cloudflare-admission.mjs',
        'scripts/verify-cloudflare-provider.mjs',
        'scripts/verify-cloudflare-closed.mjs',
        'scripts/verify-cloudflare-directory.mjs',
        'scripts/build-cloudflare-closed.mjs',
        'infra/cloudflare/**',
        '.github/workflows/expo.yml',
      ]

permissions:
  contents: read

concurrency:
  group: expo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: infra/cloudflare/package-lock.json
      - name: Portable Rust and WASM toolchains
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt,llvm-tools-preview --target wasm32-unknown-unknown
          rustup default 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: cloudflare-admission
      - name: Install pinned Worker and WASM tools
        run: |
          npm ci --prefix infra/cloudflare
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Shared admission rules and portable boundary regressions
        run: |
          cargo fmt --all --check
          cargo test --locked -p roda-relay-admission
          cargo clippy --locked -p roda-relay-admission --all-targets -- -D warnings
      - name: Compare native, WASM and real workerd receipts
        # Public deterministic fixtures only; no account credentials or deployment.
        run: node scripts/verify-cloudflare-admission.mjs --out-dir .dev/cloudflare-admission
      - name: Verify shared Apple and Google assertion policy in workerd
        run: node scripts/verify-cloudflare-provider.mjs --out-dir .dev/cloudflare-provider
      - name: Retain portable admission evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-admission-evidence
          path: |
            .dev/cloudflare-admission
            .dev/cloudflare-provider
          if-no-files-found: warn
          retention-days: 7

  cloudflare-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: infra/cloudflare/package-lock.json
      - run: npm ci
      - run: npm run check --workspace relay-state
      # Actual workerd/SQLite transactions; CI never deploys or accesses an account.
      - run: npm test --workspace relay-state

  # Builds the Expo application and its native module, distinct from the legacy
  # Kotlin client's android.yml. APK compilation is not device-flow acceptance.
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
      ZOEN_ANDROID_ABIS: arm64-v8a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/zoen/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Expo Android SDK, NDK and Rust toolchain
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
          rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android
          rustup default 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: expo-android-release
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install pinned application and Android binding tools
        run: |
          npm ci --prefix apps/zoen
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build shared Rust core and generate Expo Android project
        run: |
          node scripts/build-expo-core.mjs android --release
          cd apps/zoen
          node_modules/.bin/expo prebuild --platform android --no-install
      - name: Compile Expo release and native lifecycle regressions
        working-directory: apps/zoen/android
        # The Expo library exposes its JVM host tests on the debug variant.
        # R8 exhausted Expo's default 2 GiB heap. The public Ubuntu runner has
        # 16 GiB; keep room for native/Kotlin workers and serialize projects.
        run: |
          free -h
          ./gradlew :app:assembleRelease :zoen-core:testDebugUnitTest \
            --max-workers=2 --no-parallel \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            -PreactNativeArchitectures=arm64-v8a
      - name: Retain Expo Android build and native test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: expo-android-release
          path: |
            apps/zoen/android/app/build/outputs/apk/release/*.apk
            apps/zoen/modules/zoen-core/android/build/test-results/
            apps/zoen/modules/zoen-core/android/build/reports/tests/
            apps/zoen/modules/zoen-core/generated/android/core-contract.json
          if-no-files-found: warn
          retention-days: 7

  miniapp-resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            tools/miniapp-build/package-lock.json
            packages/zoen-ui/package-lock.json
            apps/zoen/package-lock.json
            miniapps/excalidraw-ui/package-lock.json
      - name: Install pinned miniapp, host and DOM test dependencies
        run: |
          npm ci --prefix tools/miniapp-build
          npm ci --prefix packages/zoen-ui
          npm ci --prefix apps/zoen
          npm ci --prefix miniapps/excalidraw-ui
      - name: Verify pinned Excalidraw UI and early MCP event delivery
        run: |
          npm test --prefix miniapps/excalidraw-ui
          node miniapps/excalidraw-ui/build.mjs --check
      - name: Strict types for built-in MCP Apps sources and shared SDK
        run: apps/zoen/node_modules/.bin/tsc -p miniapps/builtins/tsconfig.json
      - name: Real bundled UI, canonical builtin tools and opt-in calendar regressions
        run: node --test tools/miniapp-build/*.test.mjs miniapps/builtins/test/*.test.mjs miniapps/schedule/src/availability.test.ts miniapps/schedule/src/availability-ui.test.mjs
      - name: Verify embedded resources match source and capability manifests
        run: |
          node tools/miniapp-build/check.mjs miniapps/schedule
          node tools/miniapp-build/check.mjs miniapps/hike
          for app in pet poll list maptap recipe countdown; do
            node tools/miniapp-build/check.mjs miniapps/builtins crates/roda-apps/resources "manifests/$app.json"
          done

  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: apps/zoen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/zoen/package-lock.json
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: expo-client-contract
      - run: npm ci
      - name: Verify generated Rust contract
        run: |
          npm run core:types
          git diff --exit-code -- src/core/generated
          test -z "$(git ls-files --others --exclude-standard src/core/generated)"
      - name: TypeScript, Oxlint, Oxfmt and client tests
        run: npm run check
      - name: Expo SDK compatibility
        run: npx --yes expo-doctor@1.21.5

  # Exercises the exported Expo Router application, not the separate legacy Web shell.
  release-web-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      EXPO_NO_TELEMETRY: '1'
      ZOEN_EXPO_EVIDENCE: ${{ github.workspace }}/.dev/expo-web-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            apps/zoen/package-lock.json
            scripts/expo-web-tests/package-lock.json
      - name: Rust and WASM toolchains
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component llvm-tools-preview --target wasm32-unknown-unknown
          rustup default 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: expo-release-web-acceptance
      - name: Install application and acceptance tools
        run: |
          npm ci --prefix apps/zoen
          npm ci --prefix scripts/expo-web-tests
          npm ci --prefix infra/cloudflare
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Disposable Postgres and FoundationDB
        run: |
          pg=""
          for attempt in 1 2 3; do
            for img in public.ecr.aws/docker/library/postgres:17-alpine mirror.gcr.io/library/postgres:17-alpine; do
              docker pull -q "$img" && { pg="$img"; break 2; }
            done
            sleep $((attempt * 15))
          done
          test -n "$pg"
          docker run -d --name expo-pg -p 5432:5432 -e POSTGRES_USER=zoen -e POSTGRES_HOST_AUTH_METHOD=trust "$pg"
          scripts/fdb.sh up
          eval "$(scripts/fdb.sh env)"
          for v in FDB_CLUSTER_FILE LIBRARY_PATH LD_LIBRARY_PATH; do echo "$v=${!v}" >> "$GITHUB_ENV"; done
          for _ in $(seq 1 30); do docker exec expo-pg pg_isready -U zoen >/dev/null 2>&1 && break; sleep 1; done
          docker exec expo-pg pg_isready -U zoen
      - name: Build canonical peers and Expo release artifact
        env:
          EXPO_PUBLIC_ZOEN_RELAY_URL: http://127.0.0.1:8790
          # This synthetic relay has no provider configuration. Normal device linking
          # is the journey under test; no credentials or fake provider proofs are used.
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ''
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ''
        run: |
          cargo build --locked -p zoen-relay -p zoen-cli
          npm run export:web --prefix apps/zoen
      - name: Expo release EN and PT-BR linking, encrypted roundtrip and cold reload
        env:
          RELAY: http://127.0.0.1:8790
          DATABASE_URL: postgres://zoen@127.0.0.1:5432/postgres
          ZOEN_RELAY_NAME: zoen-expo-acceptance
          ZOEN_FDB_CELL: expo-release-acceptance
          ZOEN_BLOB_DIR: .dev/expo-release-blobs
          ZOEN_LIMITS: connect_ip=100000/s:100000,register_ip=100000/s:100000
        run: |
          mkdir -p .dev/expo-release-blobs
          target/debug/zoen-relay --bind 127.0.0.1:8790 > "$RUNNER_TEMP/expo-relay.log" 2>&1 &
          relay_pid=$!
          trap 'kill "$relay_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS "$RELAY/healthz" >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          expo_chrome="$(command -v google-chrome)"
          expo_status=0
          for expo_locale in en-US pt-BR; do
            if ZOEN_EXPO_TEST_LOCALE="$expo_locale" CHROME="$expo_chrome" node scripts/expo-web-e2e.mjs; then
              :
            else
              expo_status=1
            fi
          done
          exit "$expo_status"
      - name: Compare native FDB and private Cloudflare closed-group transactions
        # Reuses this job's isolated FDB and canonical native build. No account
        # credentials, public relay, DNS changes or deployment are involved.
        run: node scripts/verify-cloudflare-closed.mjs --out-dir .dev/cloudflare-closed
      - name: Retain private closed-group differential evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-closed-evidence
          path: .dev/cloudflare-closed
          if-no-files-found: warn
          retention-days: 7
      - name: Compare native Postgres and private Cloudflare provider enrollment
        # Synthetic assertions only. Shares this job's disposable database and
        # the WASM built above; no provider credentials or deployment.
        env:
          ZOEN_TEST_PG: postgres://zoen@127.0.0.1:5432/postgres
        run: node scripts/verify-cloudflare-provider.mjs --host --skip-build --out-dir .dev/cloudflare-provider-host
      - name: Retain private provider enrollment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-provider-host-evidence
          path: .dev/cloudflare-provider-host
          if-no-files-found: warn
          retention-days: 7
      - name: Compare native encrypted media HTTP and private Cloudflare R2 adapter
        # Native ciphertext and actual HTTP responses versus local workerd/R2.
        # No Cloudflare credentials, real bucket writes or deployment.
        env:
          ZOEN_TEST_PG: postgres://zoen@127.0.0.1:5432/postgres
        run: node scripts/verify-cloudflare-directory.mjs --media --skip-build --out-dir .dev/cloudflare-media
      - name: Retain private encrypted media differential evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-media-evidence
          path: .dev/cloudflare-media
          if-no-files-found: warn
          retention-days: 7
      - name: Compare native Postgres and private Cloudflare directory transactions
        # The oracle creates and removes only its own schema in this job's
        # disposable database. Reuse the current shared WASM from the closed check.
        env:
          DATABASE_URL: postgres://zoen@127.0.0.1:5432/postgres
        run: node scripts/verify-cloudflare-directory.mjs --skip-build --out-dir .dev/cloudflare-directory
      - name: Retain private directory differential evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-directory-evidence
          path: .dev/cloudflare-directory
          if-no-files-found: warn
          retention-days: 7
      - name: Retain release acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: expo-release-web-evidence
          path: ${{ github.workspace }}/.dev/expo-web-evidence
          if-no-files-found: warn
          retention-days: 7
