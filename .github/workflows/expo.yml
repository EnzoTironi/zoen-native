name: expo

on:
  pull_request:
    paths: ["apps/zoen/**", "packages/zoen-ui/web/**", "crates/**", "Cargo.toml", "Cargo.lock", "scripts/build-expo-*.mjs", ".github/workflows/expo.yml"]
  push:
    branches: [main]
    paths: ["apps/zoen/**", "packages/zoen-ui/web/**", "crates/**", "Cargo.toml", "Cargo.lock", "scripts/build-expo-*.mjs", ".github/workflows/expo.yml"]

permissions:
  contents: read

concurrency:
  group: expo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      EXPO_NO_TELEMETRY: "1"
    defaults:
      run:
        working-directory: apps/zoen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/zoen/package-lock.json
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: expo-client-contract
      - run: npm ci
      - name: Verify generated Rust contract
        run: |
          npm run core:types
          git diff --exit-code -- src/core/generated
          test -z "$(git ls-files --others --exclude-standard src/core/generated)"
      - name: TypeScript, Oxlint, Oxfmt and client tests
        run: npm run check
      - name: Expo SDK compatibility
        run: npx --yes expo-doctor@1.21.5
