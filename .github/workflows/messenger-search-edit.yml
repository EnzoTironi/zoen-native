name: messenger-search-edit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/zoen-ui/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: packages/zoen-ui
      - run: npm run typecheck:web
        working-directory: packages/zoen-ui
      - run: npm run test:web
        working-directory: packages/zoen-ui
