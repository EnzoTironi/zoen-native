name: ios-android-parity

on:
  pull_request:
    paths: ['apple/**', 'android/**', 'crates/**', 'scripts/*parity*', 'docs/dev/ios-parity.md', 'packages/zoen-ui/**', '.github/workflows/ios-android-parity.yml', 'Cargo.*']
  push:
    branches: [main]
    paths: ['apple/**', 'android/**', 'crates/**', 'scripts/*parity*', 'packages/zoen-ui/**', '.github/workflows/ios-android-parity.yml', 'Cargo.*']
  workflow_dispatch:
    inputs:
      threshold:
        description: Maximum different pixels percent (default 2.5; do not raise to hide regressions)
        default: '2.5'
        required: true

permissions:
  contents: read

concurrency:
  group: native-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - viewport: narrow
            device: com.apple.CoreSimulator.SimDeviceType.iPhone-17
          - viewport: wide
            device: com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M5-16GB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow==11.3.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Restored target mtimes can otherwise hide Rust modules added after the cache was saved.
          key: parity-ios-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'crates/**/*.rs') }}
      - run: brew install xcodegen
      - name: Fresh iOS native fixture frames
        id: ios_capture
        run: |
          mkdir -p parity
          set -o pipefail
          (
            set -e
            DEVICE=$(xcrun simctl create NativeParity '${{ matrix.device }}')
            xcrun simctl boot "$DEVICE"
            python3 scripts/parity_capture.py ios --device "$DEVICE" --viewport '${{ matrix.viewport }}' --output parity/ios
          ) 2>&1 | tee "parity/ios-${{ matrix.viewport }}.log"
      - name: Report iOS capture failure
        if: failure() && steps.ios_capture.outcome == 'failure'
        env:
          CAPTURE_LOG: parity/ios-${{ matrix.viewport }}.log
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          log = Path(os.environ['CAPTURE_LOG'])
          if log.is_file():
              with log.open('rb') as file:
                  file.seek(max(0, log.stat().st_size - 8000))
                  message = file.read(8000).decode(errors='replace')
          else:
              message = 'Capture log was not created; inspect the failed capture step.'
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=iOS parity capture failed::{message}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-ios-${{ matrix.viewport }}
          path: |
            parity/ios/*.png
            parity/ios/manifest.json
            parity/ios/native.xcresult
            parity/ios-${{ matrix.viewport }}.log
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow==11.3.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fresh Android native fixture frames
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 scripts/parity_capture.py android --output parity/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-android
          path: |
            parity/android
            android/app/build/outputs/androidTest-results
          if-no-files-found: error

  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Export canonical fixture from current Rust seed, not an old PNG/data baseline
        run: |
          ZOEN_PARITY_FIXTURE=native-parity-v1 ZOEN_PARITY_EXPORT="$PWD/packages/zoen-ui/web/fixtures/native-parity-v1.json" cargo test -p roda-ffi parity_fixture::tests::export_native_fixture --lib -- --ignored --exact
          git diff --exit-code -- packages/zoen-ui/web/fixtures/native-parity-v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: parity-canonical-fixture
          path: packages/zoen-ui/web/fixtures/native-parity-v1.json
          if-no-files-found: error

  web:
    needs: fixtures
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewport: [narrow, wide]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/zoen-ui/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: parity-canonical-fixture
          path: packages/zoen-ui/web/fixtures
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: parity-web
      - name: Install matching WASM binding generator
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build current web sources and install isolated capture dependency
        run: |
          npm ci --prefix packages/zoen-ui
          npm run build:web --prefix packages/zoen-ui
          npm install --prefix "$RUNNER_TEMP/parity-playwright" playwright@1.56.1
          "$RUNNER_TEMP/parity-playwright/node_modules/.bin/playwright" install webkit
      - name: Render current app in mobile and wide macOS WebKit
        run: |
          npm run web --prefix packages/zoen-ui > "$RUNNER_TEMP/parity-web.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/parity_web_capture.mjs --url 'http://127.0.0.1:4174/?parity=1' --viewport '${{ matrix.viewport }}' --output parity/web --playwright "$RUNNER_TEMP/parity-playwright/node_modules/playwright/index.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-web-${{ matrix.viewport }}
          path: parity/web
          if-no-files-found: error

  compare:
    if: always()
    needs: [ios, android, web, fixtures]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow==11.3.0
      - run: python3 scripts/test_parity_compare.py
      - run: python3 scripts/test_parity_capture.py
      - run: python3 scripts/test_parity_icon_compare.py
      - uses: actions/download-artifact@v4
        continue-on-error: true # Missing artifacts fail their comparison without hiding other profiles.
        with:
          name: parity-ios-narrow
          path: parity/ios-narrow
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: parity-ios-wide
          path: parity/ios-wide
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: parity-web-narrow
          path: parity/web-narrow
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: parity-web-wide
          path: parity/web-wide
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: parity-android
          path: parity/android-artifact
      - name: Compare every native screen; never accept stale baselines
        env:
          PARITY_THRESHOLD: ${{ inputs.threshold || '2.5' }}
        run: |
          status=0
          python3 scripts/parity_compare.py --ios parity/ios-narrow --android parity/android-artifact/parity/android --config scripts/parity_config.json --output parity/report/android-narrow --threshold "$PARITY_THRESHOLD" || status=1
          python3 scripts/parity_compare.py --ios parity/ios-narrow --web parity/web-narrow --config scripts/parity_config.json --output parity/report/web-narrow --threshold "$PARITY_THRESHOLD" || status=1
          python3 scripts/parity_compare.py --ios parity/ios-wide --web parity/web-wide --config scripts/parity_config_wide.json --output parity/report/web-wide --threshold "$PARITY_THRESHOLD" || status=1
          exit "$status"
      - name: Human-readable percentages
        if: always()
        run: |
          for profile in android-narrow web-narrow web-wide; do
            echo "## $profile" >> "$GITHUB_STEP_SUMMARY"
            if test -f "parity/report/$profile/report.md"; then
              cat "parity/report/$profile/report.md" >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'Capture/fixture contract failed; this comparison is not verified.' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-diffs-and-reports
          path: parity/report
          if-no-files-found: warn
